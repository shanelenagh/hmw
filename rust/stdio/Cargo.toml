[package]
name = "mcpws"
version = "0.1.0"
edition = "2024"

[dependencies]
argh = "0.1.13"
mcpw = { path = "../common" }
typify-macro = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing="0.1"
tracing-subscriber = "0.3"

[features]
default = ["debug_log"]
# Whether to enable debug trace statements in code (increases binary size by >100K, if small binary really matters to you)
debug_log = []