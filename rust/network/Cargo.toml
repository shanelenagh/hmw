[package]
name = "mcpwn"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
tower-http = { version ="0.6.6", features = ["cors"] }
lazy_static = "1.5.0"
mcpw = { path = "../common", features = [ "network_client" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
tracing="0.1"
uuid = { version = "1.18.1", features = [ "v4"] }

[features]
default = ["debug_log"]
# Whether to enable debug trace statements in code (increases binary size by >100K, if small binary really matters to you)
debug_log = []